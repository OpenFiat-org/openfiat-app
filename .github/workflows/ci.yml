name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: install / lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # package.json depends on "@openfiat/sdk": "file:../openfiat-sdks/typescript"
      # (no npm-published version exists yet). actions/checkout refuses a
      # `path` outside the workspace, so check it out inside the workspace
      # and copy it to the true sibling location the file: dependency expects.
      - uses: actions/checkout@v7
        with:
          repository: OpenFiat-org/openfiat-sdks
          path: openfiat-sdks-checkout
      - run: mkdir -p ../openfiat-sdks && cp -r openfiat-sdks-checkout/. ../openfiat-sdks/
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - working-directory: ../openfiat-sdks/typescript
        run: pnpm install --no-frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
